name: java-build job using GH action

on:
  push:
    branches:
      - stage

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Set up JDK 11 for x64
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          architecture: x64
      - name: maven version
        run: mvn --version
      - name: run tests
        run: mvn test
      - name: building jar
        run: mvn clean package
      - name: check path of war
        run: |
          echo $PWD
      - name: upload jar
        uses: actions/upload-artifact@v4
        with:
          name: war-artifact
          path: target/*.war
  SAST_SCAN:
    needs: Build
    env:
      SONAR_HOST_URL: http://ec2-44-212-19-198.compute-1.amazonaws.com:9000
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        # Disabling shallow clones is recommended for improving the relevancy of reporting
        fetch-depth: 0
    - name: Set up JDK 11 for x64
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        architecture: x64
    - name: Run tests with coverage
      run: mvn clean test
    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v5.2.0 
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        SONAR_SCANNER_OPTS: "-Dsonar.projectKey=maven-web-application -Dsonar.java.binaries=target/classes"
  DAST_SCAN:
    needs: Build
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    - name: Download WAR artifact
      uses: actions/download-artifact@v4
      with:
        name: war-artifact
        path: target/
    - name: Start application with Jetty
      run: |
        mvn jetty:run &
        sleep 60
        curl -f http://localhost:8080/maven-web-application|| exit 1
    - name: OWASP ZAP Scan
      uses: zaproxy/action-baseline@v0.12.0
      with:
        target: 'http://localhost:8080/maven-web-application'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'