name: java-build job using GH action

on:
  push:
    branches:
      - stage

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Set up JDK 11 for x64
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          architecture: x64
      - name: maven version
        run: mvn --version
      - name: building jar
        run: mvn clean package
      - name: check path
        run: |
          echo $PWD
      - name: upload jar
        uses: actions/upload-artifact@v4
        with:
          name: war-artifact
          path: target/*.war